<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku</title>
    <link rel="stylesheet" href="style.css">
    <script src="sudoku.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <h1>Sudoku</h1>

        <div class="hud">
            <p>Mistakes <span id="mistakes"></span></p>
            <p id="status" role="status"></p>
        </div>

        <div id="board" class="board" role="group" aria-label="Sudoku board"></div>

        <div class="controls">
            <label class="field">
                Difficulty
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </label>
            <button id="new-game" class="primary">New game</button>
            <button id="hint">Hint (<span id="hints"></span>)</button>
            <button id="restart">Restart</button>
            <button id="solve">Show solution</button>
        </div>
    </main>
</body>
</html>
